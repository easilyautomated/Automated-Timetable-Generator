<h1>Add Subject</h1>

{% if errors %}
    <ul style="color: red;">
    {% for error in errors %}
        <li>{{ error }}</li>
    {% endfor %}
    </ul>
{% endif %}

<form method="POST">
    <input type="text" name="subject_name" value="{{ name or '' }}" placeholder="Subject name">
    <input type="number" name="periods_per_week" value="{{ periods_per_week or '' }}" placeholder="Periods per week">

    <select name="required_room_type">
        <option value="standard" {% if required_room_type == "standard" %}selected{% endif %}>Standard</option>
        <option value="lab" {% if required_room_type == "lab" %}selected{% endif %}>Lab</option>
        <option value="art" {% if required_room_type == "art" %}selected{% endif %}>Art</option>
        <option value="music" {% if required_room_type == "music" %}selected{% endif %}>Music</option>
        <option value="gym" {% if required_room_type == "gym" %}selected{% endif %}>Gym</option>
        <option value="DT" {% if required_room_type == "DT" %}selected{% endif %}>DT</option>
    </select>

    <button type="submit">Save</button>
</form>
