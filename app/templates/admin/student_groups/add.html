<h1>Add Student Group</h1>

{% if errors %}
    <ul style="color: red;">
    {% for error in errors %}
        <li>{{ error }}</li>
    {% endfor %}
    </ul>
{% endif %}

<form method="POST">
    <input type="text" name="student_group_name" value="{{ student_group_name or '' }}" placeholder="Group name">
    <input type="number" name="year_group" value="{{ year_group or '' }}" placeholder="Year group">
    <input type="number" name="group_size" value="{{ group_size or '' }}" placeholder="Group size">

    <fieldset>
        <legend>Subjects</legend>
        {% for subject in subjects %}
            <label>
                <input type="checkbox" name="subjects" value="{{ subject['subject_id'] }}">
                {{ subject['name'] }}
            </label><br>
        {% endfor %}
    </fieldset>

    <button type="submit">Save</button>
</form>
