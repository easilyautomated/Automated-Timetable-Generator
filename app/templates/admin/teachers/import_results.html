<h1>Import Results</h1>

<p>{{ success_count }} teacher(s) imported successfully.</p>

{% if row_errors %}
    <h2>Failed rows</h2>
    <ul>
    {% for entry in row_errors %}
        <li>
            Row {{ entry["row"] }}:
            <ul>
            {% for error in entry["errors"] %}
                <li>{{ error }}</li>
            {% endfor %}
            </ul>
        </li>
    {% endfor %}
    </ul>
{% endif %}

<a href="{{ url_for('admin.import_teachers') }}">Import another file</a>
