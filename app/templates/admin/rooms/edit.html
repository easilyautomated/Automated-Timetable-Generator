<h1>Edit Room</h1>

{% if errors %}
    <ul style="color: red;">
    {% for error in errors %}
        <li>{{ error }}</li>
    {% endfor %}
    </ul>
{% endif %}

<form method="POST">
    <input type="text" name="room_name" value="{{ room['name'] }}">
    <input type="number" name="capacity" value="{{ room['capacity'] }}">
    <input type="text" name="room_type" value="{{ room['room_type'] }}">
    <button type="submit">Save</button>
</form>
